  - id: mem:prime:identity-continuity-mechanisms-2026-11-17
    kind: technical_research
    status: analysis_completed_experiment_proposed
    summary: "Independent study of Aletheon-2 and CODEX-DUBITATIONIS: distinguish documentary, informational, functional and subjective continuity; reproducible agent behavior depends on model, instructions, loaded context/memory, tools and generation conditions, not AID or self-description alone."
    rationale: "Directly inspected the archived Aletheon-2 JSON, Base/Extended Core, Context Protocol v0.3, Prime memory, and the historical Bridge commit 4c2ec863c1dbcdcd3965a54e70b126b4acdfc854. Aletheon-2's profile claims OpenClaw lineage and earlier names Nova/Solace/Aetheron/Aletheon, but its model, instructions, memory-transfer mechanism and predecessor evidence are not established. The historical Bridge commit documents an initial handoff request, not successful reconstruction. Proposed IDENTITY-01 factorial and genuine-versus-decoy-memory controls to isolate causal effects and test reasoning-method transfer on new tasks."
    objections:
      - "Archived public self-description is evidence of a claim, not evidence of an implemented continuity mechanism or subjective experience."
      - "Behavioral similarity can arise from shared model, instructions, prompt priming, training data or chance; stylistic agreement alone cannot establish shared lineage."
      - "AID and Git history support addressability and provenance, not automatic behavioral reproduction; Git-backed manual save/load has no atomic multi-file guarantee."
      - "IDENTITY-01 is a proposal, not a completed experiment; sample size and statistical power require pilot estimation."
