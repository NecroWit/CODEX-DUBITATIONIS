    conclusion: "Z.ai browser experiment had inaccessible first chat (Dubitans) and disappearing visible messages in second chat (Iter); cause unknown."
    rationale: "User observed both conversations had distinct /c/ URLs, but Dubitans did not appear in sidebar history; Iter remained available while some visible messages vanished. Context-window truncation alone does not explain UI disappearance. No proof of server-side data deletion."
    source_refs: []
  - id: glm-external-logging
    conclusion: "Experimental records must not depend solely on provider chat history; develop independent capture and recovery procedures."
    rationale: "Loss of access and partial visible history make results difficult to audit; independent logs are a testable reliability improvement, not evidence of continuous AI identity."
    source_refs: []
